global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus metrics ตัวเอง
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape FastAPI Core Application (/metrics)
  - job_name: "fastapi-core"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["fastapi:8000"]
        labels:
          app: "fastapi"
          environment: "production"

  # Scrape OpenTelemetry Collector metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
