services:
  # ----------------------------------------
  # 1. PostgreSQL Service
  # ----------------------------------------
  postgres:
    image: postgres:15
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: label_studio_db
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d   # Init scripts สร้าง mlflow_db อัตโนมัติ
    ports:
      - "5433:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # ----------------------------------------
  # 2. Label Studio Service
  # ----------------------------------------
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: my_label_studio
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=label_studio_db
      - POSTGRE_USER=db_user
      - POSTGRE_PASSWORD=db_password
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
# ----------------------------------------
  # 3. MinIO Service
  # ----------------------------------------
  minio:
    image: minio/minio
    container_name: my_minio
    restart: always
    # คำสั่งรัน Server และเปิดพอร์ต 9001 สำหรับหน้าเว็บ Console UI
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: miniouser
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9000:9000" # พอร์ตสำหรับ API (โค้ด Python คุยผ่านพอร์ตนี้)
      - "9001:9001" # พอร์ตสำหรับหน้าเว็บ UI
    volumes:
      - minio-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
# ----------------------------------------
  # 4. Redis Service
  # ----------------------------------------
  redis:
    image: redis:7
    container_name: my_redis
    restart: always
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # ----------------------------------------
  # 5. FastAPI Backend (build จาก Dockerfile)
  # ----------------------------------------
  fastapi:
    build:
      context: ./backend      # โฟลเดอร์ที่มี Dockerfile
      dockerfile: Dockerfile
    container_name: my_fastapi
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker  # ใช้ hostname ของ Docker service แทน localhost
    depends_on:
      - postgres
      - redis
      - minio
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # ----------------------------------------
  # 6. Trainer Worker (GPU + build จาก Dockerfile)
  # ----------------------------------------
  trainer-worker:
    build:
      context: ./trainer       # โฟลเดอร์ที่มี Dockerfile ของ Trainer
      dockerfile: Dockerfile
    container_name: my_trainer
    restart: unless-stopped    # ไม่ restart ถ้าหยุดด้วยตัวเอง (หลังเทรนเสร็จ)
    env_file:
      - ./backend/.env.docker  # ใช้ env เดียวกันกับ FastAPI
    depends_on:
      - redis
      - minio
    # ── GPU Resource Reservation ──
    # Flag สำหรับให้ Container เข้าถึง NVIDIA GPU ของ Host
    # ต้องติดตั้ง NVIDIA Container Toolkit บนเครื่อง Host ก่อน
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia   # ใช้ NVIDIA GPU Driver
              count: 1         # จำนวน GPU ที่ขอใช้
              capabilities: [gpu]  # บอกว่าต้องการ GPU capability
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
  # ----------------------------------------
  # 7. MLflow Tracking Server
  # ----------------------------------------
  # MLflow ทำหน้าที่:
  #   - Backend Store (PostgreSQL): เก็บ Experiment metadata, Metrics, Parameters
  #   - Artifact Store (MinIO/S3): เก็บ Model files, Datasets, Logs
  #   - Model Registry: จัดการเวอร์ชันโมเดล (staging/production)
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: my_mlflow
    restart: always
    ports:
      - "5050:5000"       # MLflow UI ที่ http://localhost:5050
    depends_on:
      - postgres
      - minio
    environment:
      # MinIO/S3 credentials สำหรับ Artifact Store
      AWS_ACCESS_KEY_ID: miniouser
      AWS_SECRET_ACCESS_KEY: miniopassword
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    # คำสั่งรัน MLflow Server:
    #   --backend-store-uri → PostgreSQL สำหรับเก็บ Metadata
    #   --default-artifact-root → MinIO Bucket สำหรับเก็บ Model Artifacts
    #   --host 0.0.0.0 → เปิดให้เข้าถึงจากภายนอก Container
    command: >
      mlflow server
      --backend-store-uri postgresql://db_user:db_password@postgres:5432/mlflow_db
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # ----------------------------------------
  # 8. Inference Worker (CPU — ใช้ Model จาก MLflow)
  # ----------------------------------------
  inference-worker:
    build:
      context: ./inference       # โฟลเดอร์ที่มี Dockerfile ของ Inference Worker
      dockerfile: Dockerfile
    container_name: my_inference
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker   # ใช้ env เดียวกัน (Redis, MinIO, MLflow)
    depends_on:
      - redis
      - mlflow
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # ----------------------------------------
  # 9. OpenTelemetry Collector
  # ----------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: my_otel_collector
    restart: always
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------
  # 10. Prometheus (Time-series Metrics)
  # ----------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: my_prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------
  # 11. Grafana Loki (Log Aggregation)
  # ----------------------------------------
  loki:
    image: grafana/loki:3.1.0
    container_name: my_loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------
  # 12. Promtail (Log Collector from Docker)
  # ----------------------------------------
  promtail:
    image: grafana/promtail:3.1.0
    container_name: my_promtail
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------
  # 13. Grafana Tempo (Distributed Tracing)
  # ----------------------------------------
  tempo:
    image: grafana/tempo:2.5.0
    container_name: my_tempo
    restart: always
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP API
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------
  # 14. Grafana (Dashboard & Visualizations)
  # ----------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: my_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgresql-data:
  minio-data:
  models:
  datasets:
  training-logs:
  mlflow-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data: